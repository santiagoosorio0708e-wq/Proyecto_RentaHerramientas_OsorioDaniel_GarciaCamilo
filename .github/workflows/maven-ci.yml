name: Java CI con Maven

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout del repositorio
      uses: actions/checkout@v4

    - name: Configurar Java 21 LTS
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Dar permisos de ejecución al Maven Wrapper
      run: chmod +x ./mvnw

    - name: Ejecutar pruebas automatizadas con Maven
      run: ./mvnw clean test

    - name: Compilar y empaquetar artefacto JAR
      run: ./mvnw package -DskipTests
