<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="refresh" content="0; url=frontend/index.html">
    <title>Cargando RentaTools...</title>
    <script>
        window.location.replace("frontend/index.html");
    </script>
    <style>
        body {
            background-color: #080c14;
            color: #f8fafc;
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .cargador {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }
        .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid rgba(245, 158, 11, 0.2);
            border-top-color: #f59e0b;
            border-radius: 50%;
            animation: girar 0.8s linear infinite;
        }
        @keyframes girar {
            to { transform: rotate(360deg); }
        }
        a {
            color: #f59e0b;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="cargador">
        <div class="spinner"></div>
        <h2>Redirigiendo a RentaTools...</h2>
        <p>Si no es redirigido automáticamente, <a href="frontend/index.html">haga clic aquí</a>.</p>
    </div>
</body>
</html>
