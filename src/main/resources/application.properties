spring.application.name=renta-herramientas

# Servidor
server.port=${SERVER_PORT:8080}
server.servlet.context-path=/api/v1

# Conexión Base de Datos SQLite (Portable, autocontenida y lista para Windows y macOS)
spring.datasource.url=${DB_URL:jdbc:sqlite:renta_herramientas.db}
spring.datasource.driver-class-name=${DB_DRIVER:org.sqlite.JDBC}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}

# Configuración del pool Hikari para SQLite (Modo WAL, Foreign Keys y Concurrencia Segura)
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL:5}
spring.datasource.hikari.connection-init-sql=PRAGMA journal_mode=WAL; PRAGMA foreign_keys=ON; PRAGMA busy_timeout=30000;

# Configuración JPA / Hibernate para SQLite
spring.jpa.database-platform=${JPA_DIALECT:org.hibernate.community.dialect.SQLiteDialect}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Seguridad y JWT (Sin hardcoding de secrets en producción)
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
# Refresh token: vigencia más larga (7 días por defecto) para renovar el access token
jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}

# CORS: orígenes del frontend autorizados (separados por coma).
# En producción se debe pasar APP_CORS_ALLOWED_ORIGINS con el dominio real.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5500,http://127.0.0.1:5500,http://localhost:5173,http://localhost:3000,http://localhost:4200}

# Documentación OpenAPI / Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha
